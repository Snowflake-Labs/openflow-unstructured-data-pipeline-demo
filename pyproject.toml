[project]
name = "unstructured-data-pipeline"
version = "0.1.0"
description = "Snowflake OpenFlow Unstructured Data Pipeline Demo with Festival Operations Documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "slack-bolt>=1.25.0",
    "slack-sdk>=3.23.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-include-markdown-plugin>=6.2.5",
    "mkdocs-macros-plugin>=1.3.0",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-redirects>=1.2.1",
    "mkdocs-git-revision-date-localized-plugin>=1.2.9",
    "mkdocs-git-committers-plugin-2>=2.4.0",
    "pygments>=2.18.0",
    "pymdown-extensions>=10.11.2",
]
